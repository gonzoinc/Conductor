name: Public release guard

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked files for private material
        run: python3 -B scripts/check_public_tree.py
      - name: Verify standalone installer payload
        run: python3 -B scripts/build_windows_installer.py --check
      - name: Test release guard rules
        run: python3 -B -m unittest discover -s tests -p test_public_release_guard.py
